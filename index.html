<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zach Bednarke</title>
<meta name="description" content="Zach Bednarke.">
<meta property="og:title" content="Zach Bednarke">
<meta property="og:description" content="Zach Bednarke.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zachbednarke.com/">
<meta property="og:image" content="https://zachbednarke.com/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#06040d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23fca636'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #06040d;
    --fg: #cfc7e8;
    --bright: #efeafd;
    --dim: #8f86b3;
    --faint: #6b63a0;
    --accent: #b39ddb;
    --line: #211b38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.75 -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px;
  }
  ::selection { background: #b39ddb44; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 24px; }

  /* hero */
  header.hero { min-height: 92vh; display: flex; align-items: center; }
  .hero h1 {
    font-size: clamp(40px, 7vw, 58px); color: var(--bright);
    letter-spacing: -0.02em; line-height: 1.08;
  }
  .hero .cta { margin-top: 34px; font-size: 16px; }

  /* scroll-scrubbed spherical harmonics */
  #sh-track { height: 400vh; position: relative; }
  #sh-stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  #sh-caption {
    position: absolute; bottom: 5vh; left: 0; right: 0;
    text-align: center; z-index: 2; pointer-events: none;
  }
  #sh-caption .ell { font: italic 21px Georgia, serif; color: var(--bright); }
  #sh-caption .sub {
    font-size: 11.5px; color: var(--faint); margin-top: 6px;
    font-family: ui-monospace, Menlo, monospace;
    padding: 0 16px;
  }
  @media (max-width: 560px) { #sh-caption .eq { display: none; } }
</style>
<noscript><style>
  /* without JS the animation can't run: collapse its scroll track */
  #sh-track { display: none; }
</style></noscript>
<style>

  section.block { padding: 13vh 0; }
  section.block + section.block { border-top: 1px solid var(--line); }
  h2 {
    font-size: 12px; font-weight: 600; color: var(--faint);
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 26px;
  }
  .block p + p { margin-top: 16px; }
  section.block:last-of-type { padding-bottom: 20vh; }
</style>
</head>
<body>

  <header class="hero">
    <div class="wrap">
      <h1>Zach Bednarke</h1>
      <p class="cta"><a href="mailto:zbednarke@gmail.com">zbednarke@gmail.com</a></p>
    </div>
  </header>

  <section id="sh-track" aria-label="Spherical harmonic animation">
    <div id="sh-stage">
      <div id="sh-caption">
        <div class="ell">ℓ<sub>max</sub> = <span id="ellv">0.0</span></div>
        <div class="sub">
          <span class="eq">f(θ,φ) = Σ<sub>ℓ≤L</sub> Σ<sub>m</sub>
          c<sub>ℓm</sub> Y<sub>ℓm</sub>(θ,φ) · </span>i love spherical
          harmonics
        </div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <h2>What you just watched</h2>
      <p>my name in spherical harmonics</p>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <p>also I love the trumpet</p>
      <p><a href="https://www.youtube.com/@zachbednarke">@zachbednarke on YouTube</a></p>
    </div>
  </section>

  <script src="assets/zach/data.js"></script>
  <script src="assets/zach/sh.js"></script>
  <script src="assets/zach/widget.js"></script>
  <script>
    const zh = ZachHarmonics.mount(document.getElementById("sh-stage"), {
      mode: "scroll",
      track: document.getElementById("sh-track"),
      onProgress: (l) => {
        document.getElementById("ellv").textContent = Math.floor(l);
      },
    });
    if (zh.verifyError >= 1e-9) {
      console.warn("SH self-check failed:", zh.verifyError);
    }
  </script>
</body>
</html>
