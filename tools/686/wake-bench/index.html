<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember wake phrase test</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111820; color: #eef5fc; }
body { max-width: 58rem; margin: 3rem auto; padding: 0 1.25rem; }
h1 { font-size: 2rem; margin: 0 0 .3rem; }
p { color: #b8c7d8; }
.stage { border: 1px solid #375064; border-radius: .8rem; padding: 1.4rem; margin: 1.2rem 0; background: #182633; }
#phrase { font-size: clamp(1.5rem, 4vw, 2.4rem); margin: .6rem 0; }
#cue { min-height: 1.6rem; font-weight: 700; color: #83d7ff; }
button { background: #99dfff; color: #08111c; border: 0; border-radius: .5rem; font: inherit; font-weight: 700; padding: .75rem 1rem; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
table { width: 100%; border-collapse: collapse; margin-top: 1.2rem; }
th, td { text-align: left; padding: .65rem .45rem; border-bottom: 1px solid #375064; vertical-align: middle; }
audio { width: min(15rem, 100%); height: 2rem; }
.results { overflow-x: auto; }
@media (max-width: 640px) { body { margin: 1.5rem auto; } th,td { font-size: .83rem; } }
</style>
</head>
<body>
<h1>Ember wake phrase test</h1>
<p>Ember’s USB microphone feeds the recognizers on this Mac.</p>
<section class="stage">
<p id="progress" aria-live="polite">Connecting</p>
<h2 id="phrase"></h2>
<p id="direction"></p>
<p id="cue" role="status"></p>
<button id="record" disabled>Record clip</button>
</section>
<section class="results" id="results" hidden>
<h2>Results</h2>
<p id="summary"></p>
<div id="replay" hidden>
<h2>Two-stage replay</h2>
<table id="votes">
<thead><tr><th scope="col">Second-stage rule</th><th scope="col">Wakes</th><th scope="col">False wakes</th></tr></thead>
<tbody></tbody>
</table>
</div>
<table id="clips">
<thead><tr><th scope="col">Clip</th><th scope="col">Ember</th><th scope="col">Sherpa English</th><th scope="col">Sherpa Phonetic</th><th scope="col">Audio</th></tr></thead>
<tbody></tbody>
</table>
</section>
<script>
const byId = (id) => document.getElementById(id);
const button = byId("record");
const body = byId("clips").tBodies[0];
let rendered = 0;
const cues = {
  ready: "Click Record clip, then wait for Speak now.",
  arming: "Get ready…",
  speak: "Speak now. Say the line once, then stay quiet.",
  scoring: "Comparing recognizers…",
  done: "All clips recorded."
};
button.addEventListener("click", async () => {
  button.disabled = true;
  byId("cue").textContent = cues.arming;
  try {
    if (!(await fetch("/record", {method: "POST"})).ok) throw new Error("Could not start the clip.");
  } catch (error) {
    byId("cue").textContent = error.message;
  }
});
async function refresh() {
  try {
    const state = await (await fetch("/state")).json();
    const index = state.results.length;
    const prompt = state.prompts[index];
    const progress = prompt ? `Clip ${index + 1} of ${state.prompts.length}` : `${index} clips recorded`;
    byId("progress").textContent = progress;
    byId("phrase").textContent = prompt?.[0] || "Test complete";
    byId("direction").textContent = prompt?.[1] || "";
    byId("cue").textContent = state.error || cues[state.phase] || "Connecting…";
    button.disabled = state.phase !== "ready";
    button.hidden = state.phase === "done";
    byId("results").hidden = index === 0;
    const positives = state.results.filter(row => state.prompts[row.index][2] === "wake");
    const negatives = state.results.filter(row => state.prompts[row.index][2] === "negative");
    const count = (rows, name) => rows.filter(row => row[name]).length;
    byId("summary").textContent = `Wake hits: Ember ${count(positives, "ember")}/${positives.length}, Sherpa English ${count(positives, "sherpa")}/${positives.length}, Phonetic ${count(positives, "sherpa_phones")}/${positives.length}. False wakes: Ember ${count(negatives, "ember")}/${negatives.length}, Sherpa English ${count(negatives, "sherpa")}/${negatives.length}, Phonetic ${count(negatives, "sherpa_phones")}/${negatives.length}.`;
    for (const row of state.results.slice(rendered)) {
      const tr = body.insertRow();
      tr.insertCell().textContent = `${row.index + 1}. ${state.prompts[row.index][0]}`;
      tr.insertCell().textContent = row.ember ? "Wake" : "—";
      tr.insertCell().textContent = row.sherpa ? "Wake" : row.control ? "Control detected" : "—";
      tr.insertCell().textContent = row.sherpa_phones ? "Wake" : row.control_phones ? "Control detected" : "—";
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";
      audio.src = `/clip/${String(row.index + 1).padStart(2, "0")}`;
      tr.insertCell().append(audio);
    }
    if (state.two_stage && byId("replay").hidden) {
      const table = byId("votes").tBodies[0];
      const countVotes = (kind, required) => {
        const rows = state.two_stage.filter(row => row.truth === kind);
        const matches = rows.filter(row => row.candidates.some(candidate => candidate.votes.length >= required));
        return `${matches.length}/${rows.length}`;
      };
      for (const [required, label] of [[1, "Any detector"], [2, "Two of three"], [3, "All three"]]) {
        const tr = table.insertRow();
        tr.insertCell().textContent = label;
        tr.insertCell().textContent = countVotes("wake", required);
        tr.insertCell().textContent = countVotes("negative", required);
      }
      byId("replay").hidden = false;
    }
    rendered = index;
  } catch {
    button.disabled = true;
    byId("cue").textContent = "Waiting for the local recorder…";
  } finally {
    setTimeout(refresh, 150);
  }
}
refresh();
</script>
</body>
</html>
