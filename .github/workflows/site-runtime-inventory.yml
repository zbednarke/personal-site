name: Site VM runtime inventory
on:
  push:
    branches: [main]
    paths:
      - deploy/inventory-site-runtime.py
      - .github/workflows/site-runtime-inventory.yml
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * *'
permissions:
  contents: read
concurrency:
  group: site-runtime-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test the read-only inventory parser
        run: python3 -m unittest discover -s tools/deploy -p test_runtime_inventory.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read known site runtime versions without configuration or secrets
        run: |
          set -o pipefail
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a \
            --tunnel-through-iap --quiet --ssh-flag=-oServerAliveInterval=15 --ssh-flag=-oServerAliveCountMax=4 \
            --command 'python3 -' < deploy/inventory-site-runtime.py > site-runtime-transport.txt
          python3 - <<'PY' > site-runtime-inventory.json
          import json
          from pathlib import Path
          records = [line.split('=', 1)[1] for line in Path('site-runtime-transport.txt').read_text().splitlines() if line.startswith('SITE_RUNTIME_INVENTORY=')]
          if len(records) != 1:
              raise SystemExit('The VM did not return exactly one inventory; no versions verified.')
          print(json.dumps(json.loads(records[0]), indent=2, sort_keys=True))
          PY
          cat site-runtime-inventory.json
          {
            printf '### Read-only site VM runtime inventory\n\n```json\n'
            cat site-runtime-inventory.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('site-runtime-inventory.json').read_text())
          message = json.dumps(report, sort_keys=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=SITE_RUNTIME_INVENTORY::' + message)
          if report.get('caddy_integrity') and not report['caddy_integrity']['matches_managed_build']:
              raise SystemExit('The proxy binary changed outside the verified patch workflow; review vendor updates before trusting the old scan.')
          PY
      - name: Inspect shared-host listeners, SSH policy and package metadata without secrets
        run: |
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --command 'sudo python3 - --host-audit' < deploy/inventory-site-runtime.py > host-audit-transport.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[s.split('=',1)[1] for s in Path('host-audit-transport.txt').read_text().splitlines() if s.startswith('HOST_SECURITY_INVENTORY=')]
          if len(rows)!=1: raise SystemExit('No unique host audit receipt')
          report=json.loads(rows[0])
          Path('host-security-inventory.json').write_text(json.dumps(report,indent=2))
          for section,value in report.items():
              msg=json.dumps(value,sort_keys=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=HOST_AUDIT_'+section+'::'+msg)
          PY
      - name: Inspect the one-time reboot without requesting another
        if: github.event_name != 'schedule'
        run: |
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --command 'sudo python3 -' > reboot-diagnostic-transport.txt <<'PY'
          import datetime, importlib.util, json
          from pathlib import Path
          def load(name, filename):
              s=importlib.util.spec_from_file_location(name,Path('/usr/local/libexec/site-security')/filename)
              m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          inventory=load('inventory','inventory-site-runtime.py').inventory()
          reboot=load('reboot','reboot-site-once.py')
          previous=json.loads(reboot.STATE.read_text()) if reboot.STATE.exists() else None
          decision=reboot.decision(previous,inventory['boot_id'],inventory['reboot_required'],datetime.datetime.now(datetime.timezone.utc))
          print('SITE_REBOOT_DIAGNOSTICS='+json.dumps({'inventory':inventory,'recorded_request':previous,'decision':decision}))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[s.split('=',1)[1] for s in Path('reboot-diagnostic-transport.txt').read_text().splitlines() if s.startswith('SITE_REBOOT_DIAGNOSTICS=')]
          if len(rows)!=1: raise SystemExit('No unique reboot diagnostic')
          d=json.loads(rows[0]);Path('reboot-diagnostic.json').write_text(json.dumps(d))
          msg=json.dumps(d,sort_keys=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=SITE_REBOOT_DIAGNOSTICS::'+msg)
          PY
      - name: Verify any completed reboot and private/public access
        if: github.event_name != 'schedule'
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          d=json.loads(Path('reboot-diagnostic.json').read_text())
          if d['decision']!='already_completed' or not d.get('recorded_request'):
              raise SystemExit('No completed reboot observed; no second reboot requested.')
          s=importlib.util.spec_from_file_location('check','deploy/check-post-reboot.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          r=m.validate({'boot_id':d['recorded_request']['boot_id']},d['inventory'],'request_reboot')
          r['reboot_action']='verified_prior_request'
          Path('verified-reboot.json').write_text(json.dumps(r))
          PY
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --command 'sudo python3 /usr/local/libexec/site-security/verify-jazz-auth.py >/dev/null 2>&1 && echo PRIVATE_ROUTES_VERIFIED'
          curl --fail --silent --show-error --output /dev/null --retry 3 https://zachbednarke.com/
          curl --fail --silent --show-error --output /dev/null --retry 3 https://uncleugga.com/
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('verified-reboot.json').read_text())
          msg=json.dumps(r,sort_keys=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=SITE_POST_REBOOT_SECURITY_RECEIPT::'+msg)
          PY
  cloud-audit:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      images: ${{ steps.images.outputs.images }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only command boundaries and redaction
        run: python3 -m unittest discover -s tools/deploy -p test_runtime_inventory.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read cloud configuration with existing permissions; never grant missing access
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          python3 deploy/inventory-site-runtime.py --cloud-audit > cloud-audit-transport.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[s.split('=',1)[1] for s in Path('cloud-audit-transport.txt').read_text().splitlines() if s.startswith('CLOUD_SECURITY_INVENTORY=')]
          if len(rows)!=1: raise SystemExit('No unique cloud audit receipt')
          report=json.loads(rows[0])
          Path('cloud-security-inventory.json').write_text(json.dumps(report,indent=2))
          gaps=[]
          for project,sections in report['projects'].items():
              for section,value in sections.items():
                  if value['status']!='observed': gaps.append(project+'/'+section+': '+value['status'])
          summary={'observed_sections':sum(v['status']=='observed' for p in report['projects'].values() for v in p.values()),'coverage_gaps':gaps}
          print('::notice title=CLOUD_AUDIT_COVERAGE::'+json.dumps(summary).replace('%','%25'))
          if gaps: print('::warning::Cloud audit has explicit coverage gaps; a green collection job is not an all-clear.')
          PY
      - name: Publish complete redacted site-project metadata receipt
        env:
          AUDIT_PROJECT: actual-budget-zb
        run: &publish-receipt |
          python3 - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('audit','deploy/inventory-site-runtime.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          project=os.environ['AUDIT_PROJECT']
          value=json.loads(Path('cloud-security-inventory.json').read_text())['projects'][project]
          for part in audit.receipt_chunks(value):
              print('::notice title=CLOUD_AUDIT_RECEIPT_'+project+'_'+str(part['part'])+'::'+json.dumps(part))
          PY
      - name: Publish complete redacted API-project metadata receipt
        env:
          AUDIT_PROJECT: parabolio-prod
        run: *publish-receipt
      - name: Publish complete redacted game-project metadata receipt
        env:
          AUDIT_PROJECT: voicecontrol-games
        run: *publish-receipt
      - name: Select unique deployed images for exact-digest vulnerability scans
        id: images
        run: |
          python3 - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('audit','deploy/inventory-site-runtime.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          images=audit.deployed_images(json.loads(Path('cloud-security-inventory.json').read_text()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('images='+json.dumps(images)+'\n')
          print('Selected '+str(len(images))+' unique deployed image references; application containers will not be executed.')
          PY
  production-images:
    needs: cloud-audit
    if: needs.cloud-audit.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.cloud-audit.outputs.images) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure short-lived registry authentication on this runner only
        run: gcloud auth configure-docker us-central1-docker.pkg.dev,us-west1-docker.pkg.dev --quiet
      - name: Scan immutable deployed image without executing application code
        env:
          AUDIT_IMAGE: ${{ matrix.image }}
        run: python3 deploy/inventory-site-runtime.py --scan-image "$AUDIT_IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: production-image-${{ strategy.job-index }}
          path: production-image-scan/sanitized.json
