name: Site VM runtime inventory
on:
  push:
    branches: [main]
    paths:
      - deploy/inventory-site-runtime.py
      - .github/workflows/site-runtime-inventory.yml
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * *'
permissions:
  contents: read
concurrency:
  group: site-runtime-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test the read-only inventory parser
        run: python3 -m unittest discover -s tools/deploy -p test_runtime_inventory.py
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read known site runtime versions without configuration or secrets
        run: |
          set -o pipefail
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a \
            --tunnel-through-iap --quiet --ssh-flag=-oServerAliveInterval=15 --ssh-flag=-oServerAliveCountMax=4 \
            --command 'python3 -' < deploy/inventory-site-runtime.py > site-runtime-transport.txt
          python3 - <<'PY' > site-runtime-inventory.json
          import json
          from pathlib import Path
          records = [line.split('=', 1)[1] for line in Path('site-runtime-transport.txt').read_text().splitlines() if line.startswith('SITE_RUNTIME_INVENTORY=')]
          if len(records) != 1:
              raise SystemExit('The VM did not return exactly one inventory; no versions verified.')
          print(json.dumps(json.loads(records[0]), indent=2, sort_keys=True))
          PY
          cat site-runtime-inventory.json
          {
            printf '### Read-only site VM runtime inventory\n\n```json\n'
            cat site-runtime-inventory.json
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('site-runtime-inventory.json').read_text())
          message = json.dumps(report, sort_keys=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=SITE_RUNTIME_INVENTORY::' + message)
          if report.get('caddy_integrity') and not report['caddy_integrity']['matches_managed_build']:
              raise SystemExit('The proxy binary changed outside the verified patch workflow; review vendor updates before trusting the old scan.')
          PY
      - name: Inspect the one-time reboot without requesting another
        if: github.event_name != 'schedule'
        run: |
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --command 'sudo python3 -' > reboot-diagnostic-transport.txt <<'PY'
          import datetime, importlib.util, json
          from pathlib import Path
          def load(name, filename):
              s=importlib.util.spec_from_file_location(name,Path('/usr/local/libexec/site-security')/filename)
              m=importlib.util.module_from_spec(s);s.loader.exec_module(m);return m
          inventory=load('inventory','inventory-site-runtime.py').inventory()
          reboot=load('reboot','reboot-site-once.py')
          previous=json.loads(reboot.STATE.read_text()) if reboot.STATE.exists() else None
          decision=reboot.decision(previous,inventory['boot_id'],inventory['reboot_required'],datetime.datetime.now(datetime.timezone.utc))
          print('SITE_REBOOT_DIAGNOSTICS='+json.dumps({'inventory':inventory,'recorded_request':previous,'decision':decision}))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[s.split('=',1)[1] for s in Path('reboot-diagnostic-transport.txt').read_text().splitlines() if s.startswith('SITE_REBOOT_DIAGNOSTICS=')]
          if len(rows)!=1: raise SystemExit('No unique reboot diagnostic')
          d=json.loads(rows[0]);Path('reboot-diagnostic.json').write_text(json.dumps(d))
          msg=json.dumps(d,sort_keys=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=SITE_REBOOT_DIAGNOSTICS::'+msg)
          PY
      - name: Verify any completed reboot and private/public access
        if: github.event_name != 'schedule'
        run: |
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          d=json.loads(Path('reboot-diagnostic.json').read_text())
          if d['decision']!='already_completed' or not d.get('recorded_request'):
              raise SystemExit('No completed reboot observed; no second reboot requested.')
          s=importlib.util.spec_from_file_location('check','deploy/check-post-reboot.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          r=m.validate({'boot_id':d['recorded_request']['boot_id']},d['inventory'],'request_reboot')
          r['reboot_action']='verified_prior_request'
          Path('verified-reboot.json').write_text(json.dumps(r))
          PY
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --command 'sudo python3 /usr/local/libexec/site-security/verify-jazz-auth.py >/dev/null 2>&1 && echo PRIVATE_ROUTES_VERIFIED'
          curl --fail --silent --show-error --output /dev/null --retry 3 https://zachbednarke.com/
          curl --fail --silent --show-error --output /dev/null --retry 3 https://uncleugga.com/
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('verified-reboot.json').read_text())
          msg=json.dumps(r,sort_keys=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=SITE_POST_REBOOT_SECURITY_RECEIPT::'+msg)
          PY
