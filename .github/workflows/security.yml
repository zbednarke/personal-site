name: Security dependencies
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: jazz-api/go.sum
      - name: Check reachable Go vulnerabilities
        working-directory: jazz-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit browser test dependencies
        working-directory: assets/jazz
        run: npm audit --package-lock-only --audit-level=moderate
