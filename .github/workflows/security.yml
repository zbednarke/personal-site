name: Security dependencies
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    uses: ./.github/workflows/runtime-security.yml
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            jazz-api/go.sum
            deploy/caddy-runtime/go.sum
      - name: Check reachable Go vulnerabilities
        working-directory: jazz-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Check maintained proxy dependencies
        working-directory: deploy/caddy-runtime
        run: |
          govulncheck ./...
          go list -deps ./... | python3 -c 'import sys; assert not any(s.strip().startswith("golang.org/x/crypto/openpgp") for s in sys.stdin), "OpenPGP must not be linked"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit browser test dependencies
        working-directory: assets/jazz
        run: npm audit --package-lock-only --audit-level=moderate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit film-service Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement tools/highlight/requirements.txt --vulnerability-service pypi
