name: Site VM auth security update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/site-auth-security.yml
      - deploy/upgrade-jazz-auth.py
      - deploy/publish-auth-runtime.sh
      - tools/deploy/test_auth_upgrade.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-vm-runtime-maintenance
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && !startsWith(github.event.head_commit.message, 'Rotate 686 guest password:')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: jazz-api/go.sum
      - name: Test replacement, rollback and provenance guards
        run: python3 -m unittest discover -s tools/deploy -p test_auth_upgrade.py
      - name: Test auth behavior and check reachable vulnerabilities
        working-directory: jazz-api
        run: |
          go test ./cmd/jazz-auth
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./cmd/jazz-auth
      - name: Account for the live binary's pre-import source commit
        run: |
          # The inventory found this non-ancestor source revision. Accept it
          # only after confirming its auth code is byte-identical to main.
          source=4d7e6d2d89e54952d0deeb5b64298a7384d4c296
          git fetch origin "$source"
          git diff --exit-code "$source" HEAD -- jazz-api/cmd/jazz-auth
          git rev-list HEAD > "$RUNNER_TEMP/accepted-auth-sources.txt"
          printf '%s\n' "$source" >> "$RUNNER_TEMP/accepted-auth-sources.txt"
      - name: Build the patched binary and verified upload bundle
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          payload="$RUNNER_TEMP/auth-security"
          mkdir "$payload"
          (cd jazz-api && go build -trimpath -ldflags='-s -w' -o "$payload/jazz-auth" ./cmd/jazz-auth)
          cp deploy/upgrade-jazz-auth.py deploy/inventory-site-runtime.py deploy/verify-jazz-auth.py "$payload/"
          cp "$RUNNER_TEMP/accepted-auth-sources.txt" "$payload/"
          tar -czf "$RUNNER_TEMP/auth-security.tar.gz" -C "$payload" jazz-auth upgrade-jazz-auth.py inventory-site-runtime.py verify-jazz-auth.py accepted-auth-sources.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Replace only auth, verify private access, roll back on failure
        env:
          PUBLISH_TIMEOUT: '600'
        run: |
          sha=$(git rev-parse HEAD)
          remote=/tmp/auth-security-$sha
          ssh=(gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet --ssh-flag=-oServerAliveInterval=15 --ssh-flag=-oServerAliveCountMax=4)
          bash deploy/upload-static-release.sh upload "$remote" "$RUNNER_TEMP/auth-security.tar.gz" deploy/publish-auth-runtime.sh -- "${ssh[@]}"
          bash deploy/upload-static-release.sh publish "$remote" "$RUNNER_TEMP/auth-security.tar.gz" deploy/publish-auth-runtime.sh "$sha" -- "${ssh[@]}"
      - name: Confirm the installed compiler and service status
        run: |
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --command 'python3 -' < deploy/inventory-site-runtime.py > auth-security-receipt.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = [line.split('=', 1)[1] for line in Path('auth-security-receipt.txt').read_text().splitlines() if line.startswith('SITE_RUNTIME_INVENTORY=')]
          if len(records) != 1:
              raise SystemExit('No unique live auth receipt')
          report = json.loads(records[0])
          if report['jazz_auth'].get('go_version') != 'go1.27.3' or not report['services_active']['jazz-auth']:
              raise SystemExit('Patched auth compiler/service not verified')
          message = json.dumps(report, sort_keys=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=SITE_AUTH_SECURITY_RECEIPT::' + message)
          PY

  # Two-phase envelope: prepare a VM-only key, then submit encrypted credentials.
  # Only explicit rotation commits run this job; normal auth updates stay separate.
  rotate-686-password:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && startsWith(github.event.head_commit.message, 'Rotate 686 guest password:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      ROTATION_ID: fbd773c9ba77410a9c96a83c57257059
      ROTATION_ENVELOPE: ''
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prepare or apply the encrypted 686 password rotation
        run: |
          python3 - <<'PYCODE' > "$RUNNER_TEMP/rotate-686.py"
          import base64, os
          from pathlib import Path
          print('rotation_id = ' + repr(os.environ['ROTATION_ID']))
          print('envelope = ' + repr(os.environ['ROTATION_ENVELOPE']))
          print('setter_source = ' + repr(base64.b64encode(Path('deploy/set-686-guest.py').read_bytes()).decode()))
          print(r'''
          import base64, json, os, re, stat, subprocess, sys, time, urllib.parse, urllib.request
          from pathlib import Path

          # Public parameters are inserted by the trusted deployment runner. The private
          # key never leaves the VM; only an OAEP-encrypted envelope crosses the repository.
          if os.geteuid() != 0 or not re.fullmatch(r'[a-f0-9]{32}', rotation_id):
              raise RuntimeError('Invalid rotation context')
          root = Path('/var/lib/jazz-auth-rotation')
          if root.is_symlink():
              raise RuntimeError('Unsafe rotation directory')
          root.mkdir(mode=0o700, exist_ok=True)
          metadata = root.stat()
          if metadata.st_uid != 0 or stat.S_IMODE(metadata.st_mode) != 0o700:
              raise RuntimeError('Rotation directory must be private and root-owned')
          key = root / (rotation_id + '.pem')
          done = root / (rotation_id + '.done')
          if done.exists():
              print('686_PASSWORD_ROTATION_ALREADY_COMPLETED')
              sys.exit(0)
          if not envelope:
              if key.is_symlink():
                  raise RuntimeError('Unsafe rotation key')
              if not key.exists():
                  fd = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, 'wb') as output:
                      subprocess.run(['openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:4096'], stdout=output, stderr=subprocess.DEVNULL, check=True)
              public = subprocess.check_output(['openssl', 'pkey', '-in', str(key), '-pubout'], stderr=subprocess.DEVNULL)
              print('686_ROTATION_PUBLIC_KEY=' + base64.b64encode(public).decode())
              sys.exit(0)
          if key.is_symlink() or not key.exists() or time.time() - key.stat().st_mtime > 3600:
              raise RuntimeError('Rotation key missing or expired')
          try:
              encrypted = base64.b64decode(envelope, validate=True)
              result = subprocess.run(['openssl', 'pkeyutl', '-decrypt', '-inkey', str(key), '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256'], input=encrypted, capture_output=True, check=True)
              payload = json.loads(result.stdout)
              if payload['rotation_id'] != rotation_id or not time.time() < payload['expires'] <= time.time() + 3600:
                  raise ValueError('Expired or mismatched payload')
              password, new_hash = payload['password'], payload['hash']
              if not isinstance(password, str) or not password or not re.fullmatch(r'\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}', new_hash):
                  raise ValueError('Invalid password envelope')
          except Exception:
              raise RuntimeError('Could not validate encrypted password envelope') from None
          module = {'__name__': 'guest_rotation', '__file__': '/tmp/set-686-guest.py'}
          exec(base64.b64decode(setter_source), module)
          original = json.loads(module['CONFIG'].read_text())
          old_hash = original.get('EmberGuestHash', '')
          try:
              module['set_guest'](new_hash)
              origin = original.get('PublicOrigin') or 'https://zachbednarke.com'
              opener = urllib.request.build_opener(module['NoRedirect']())
              request = urllib.request.Request(origin + '/auth/686/guest', data=urllib.parse.urlencode({'password': password}).encode(), headers={'Origin': origin, 'Content-Type': 'application/x-www-form-urlencoded'})
              try:
                  response = opener.open(request, timeout=20)
              except module['urllib'].error.HTTPError as response_error:
                  response = response_error
              with response:
                  cookie = response.headers.get('Set-Cookie', '').split(';', 1)[0]
                  if response.code != 303 or response.headers.get('Location') != '/686/' or not cookie.startswith('__Host-ember-guest='):
                      raise RuntimeError('New password login did not succeed')
              with opener.open(urllib.request.Request(origin + '/686/', headers={'Cookie': cookie}), timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError('New guest session could not access 686')
          except Exception:
              current = json.loads(module['CONFIG'].read_text())
              if current.get('EmberGuestHash', '') == new_hash:
                  module['set_guest'](old_hash)
              raise RuntimeError('Password rotation failed verification; previous hash restored when safe') from None
          key.unlink()
          done.write_text('Verified guest login and 686-only access.\n')
          done.chmod(0o600)
          print('686_PASSWORD_ROTATION_VERIFIED')
          ''')
          PYCODE
          python3 -m py_compile "$RUNNER_TEMP/rotate-686.py"
          gcloud compute ssh actual-server --project actual-budget-zb --zone us-west1-a --tunnel-through-iap --quiet \
            --ssh-flag=-oServerAliveInterval=15 --ssh-flag=-oServerAliveCountMax=4 \
            --command 'sudo python3 -' < "$RUNNER_TEMP/rotate-686.py"
