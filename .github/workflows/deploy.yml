name: Deploy
# Every merge to main deploys once its tests pass: the API to Cloud Run first
# (startup applies replay-safe migrations), then the static site as a new
# release on the site VM. One-time setup: docs/deploy.md.
# Before anything changes it checks that production holds nothing this commit
# lacks (docs/deploy.md#out-of-band-deploys) and stops if it does.
on:
  workflow_run:
    workflows: ["Trumpet and Jazz tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_overwrite_out_of_band:
        description: >-
          Deploy even though production has commits or files that are not in
          this commit (they will be overwritten)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  RUN_PROJECT: parabolio-prod
  RUN_REGION: us-central1
  SITE_PROJECT: actual-budget-zb
  SITE_ZONE: us-west1-a
  SITE_VM: actual-server
  ALLOW_OVERWRITE: ${{ inputs.allow_overwrite_out_of_band && 'true' || 'false' }}
jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The guard asks whether the live commits are ancestors of this one.
          fetch-depth: 0
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check production is not ahead of this commit
        # Production was once deployed from outside this repository, and the
        # next deploy of main silently erased it. Nothing is deployed unless
        # what is live is this commit or an ancestor of it: the static
        # release's .release-commit (written by publish-static-release.sh;
        # missing means it was not published by this workflow) and each
        # serving Cloud Run revision's commit-sha label (unlabelled revisions,
        # from before the label, only warn; revisions made by anyone but the
        # deploy service account fail unless they run an image it deployed).
        # The same ssh call reads the live hashes for the changed-files upload
        # and the live file list for the orphan warning. To overwrite on
        # purpose: Run workflow with allow_overwrite_out_of_band.
        run: |
          sha=${{ steps.commit.outputs.sha }}
          paths=(index.html .nojekyll assets jazz trumpets commonplace privacy)
          flags=(--project "$SITE_PROJECT" --zone "$SITE_ZONE" --tunnel-through-iap --quiet)
          ssh=(gcloud compute ssh "$SITE_VM" "${flags[@]}" --ssh-flag=-oServerAliveInterval=15 --ssh-flag=-oServerAliveCountMax=4)
          status=0
          t=$SECONDS
          if bash deploy/read-live-release.sh /srv/zachbednarke.com/current "${paths[@]}" -- "${ssh[@]}"; then
            bash deploy/check-deployed-commit.sh "static site" "$(cat live-commit.txt)" "$sha" || status=1
          elif [[ $ALLOW_OVERWRITE == true ]]; then
            echo "::warning::Could not read the live release; every file will be uploaded (allow_overwrite_out_of_band=true)."
          else
            echo "::error::Could not read the live release's .release-commit, so it cannot be checked. Rerun, or Run workflow with allow_overwrite_out_of_band."
            status=1
          fi
          echo "Read and check the live release: $((SECONDS - t)) s"
          run=(--project "$RUN_PROJECT" --region "$RUN_REGION")
          bash deploy/check-cloud-run-commit.sh jazz-api "$sha" "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" -- "${run[@]}" || status=1
          if [[ "${{ vars.WORKBENCH_ENABLED }}" == true ]]; then
            bash deploy/check-cloud-run-commit.sh workbench "$sha" "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" -- "${run[@]}" || status=1
          fi
          exit $status
      - name: Back up the database before migrations
        if: vars.JAZZ_CLOUD_SQL_INSTANCE != ''
        run: >-
          gcloud sql backups create --project "$RUN_PROJECT"
          --instance "${{ vars.JAZZ_CLOUD_SQL_INSTANCE }}"
          --description "Before deploy ${{ steps.commit.outputs.sha }}"
      - name: Deploy the API
        # Keeps the service's existing environment, secrets and settings. The
        # commit-sha label (on the service and the revision) is what the
        # guard above checks on the next deploy.
        env:
          MAGIC_FILM_PROVIDER: ${{ vars.MAGIC_FILM_PROVIDER }}
        run: |
          provider_flags=()
          if [[ -n "$MAGIC_FILM_PROVIDER" ]]; then
            case "$MAGIC_FILM_PROVIDER" in api|codex) ;; *) echo "Invalid Magic Film provider" >&2; exit 1 ;; esac
            provider_flags=(--update-env-vars "MAGIC_FILM_PROVIDER=$MAGIC_FILM_PROVIDER")
          fi
          # An unset variable preserves the deployed provider; it never
          # silently switches subscription jobs back to API billing.
          gcloud run deploy jazz-api --source jazz-api --quiet \
            --project "$RUN_PROJECT" --region "$RUN_REGION" \
            --update-labels "commit-sha=${{ steps.commit.outputs.sha }}" \
            --timeout 3600 --cpu 2 --memory 2Gi --concurrency 1 --max-instances 3 \
            "${provider_flags[@]}"
      - name: Point traffic at the new revision
        run: >-
          gcloud run services update-traffic jazz-api --to-latest --quiet
          --project "$RUN_PROJECT" --region "$RUN_REGION"
      - name: Check the API
        run: |
          url=$(gcloud run services describe jazz-api --project "$RUN_PROJECT" --region "$RUN_REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/health"
      - name: Deploy Workbench (the API's image, its own service)
        # Created once by hand with its environment and secrets
        # (docs/workbench/README.md#deploy); this keeps them and ships the
        # new image. Concurrency and always-on CPU are why it is separate:
        # event streams stay open and the agent loop outlives its request.
        if: vars.WORKBENCH_ENABLED == 'true'
        run: |
          flags=(--project "$RUN_PROJECT" --region "$RUN_REGION")
          revision=$(gcloud run services describe jazz-api "${flags[@]}" --format 'value(status.latestReadyRevisionName)')
          image=$(gcloud run revisions describe "$revision" "${flags[@]}" --format 'value(status.imageDigest)')
          gcloud run deploy workbench --image "$image" --quiet "${flags[@]}" \
            --update-labels "commit-sha=${{ steps.commit.outputs.sha }}" \
            --timeout 3600 --concurrency 40 --cpu 1 --memory 512Mi --no-cpu-throttling --min-instances 0 --max-instances 2
          gcloud run services update-traffic workbench --to-latest --quiet "${flags[@]}"
          url=$(gcloud run services describe workbench "${flags[@]}" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$url/health"
      - name: Update Magic Film worker image
        # The zero-idle Cloud Run Job is created once with
        # deploy/create-magic-film-job.py. Each release only changes its image.
        if: vars.MAGIC_FILM_ENABLED == 'true'
        run: |
          flags=(--project "$RUN_PROJECT" --region "$RUN_REGION")
          revision=$(gcloud run services describe jazz-api "${flags[@]}" --format 'value(status.latestReadyRevisionName)')
          image=$(gcloud run revisions describe "$revision" "${flags[@]}" --format 'value(status.imageDigest)')
          gcloud run jobs update jazz-magic-film --image "$image" --quiet "${flags[@]}" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 45m --cpu 2 --memory 4Gi
      - name: Publish the static release
        # The upload goes through the IAP tunnel, so only files whose bytes
        # differ from the live release are packaged; publish-static-release.sh
        # still copies the live release and overlays them, so the published
        # files are the same as with the full archive. If the live hashes
        # cannot be read (only possible with allow_overwrite_out_of_band; the
        # guard step read them), every file is packaged. Live files the
        # repository does not publish are listed as a warning and kept.
        # upload-static-release.sh streams the archive and the
        # publish script over an ssh session's stdin (gcloud compute scp sat
        # ~240 s through the tunnel whatever the size) and checks their SHA-256
        # on the VM; each attempt is capped at 120 s plus 1 s per 4 KB (at most
        # 900 s), with one retry. Its publish re-checks the files before sudo
        # and is capped at 300 s. Nothing is published unless the bytes match.
        # Each part's time is printed.
        run: |
          sha=${{ steps.commit.outputs.sha }}
          paths=(index.html .nojekyll assets jazz trumpets commonplace privacy)
          flags=(--project "$SITE_PROJECT" --zone "$SITE_ZONE" --tunnel-through-iap --quiet)
          ssh=(gcloud compute ssh "$SITE_VM" "${flags[@]}" --ssh-flag=-oServerAliveInterval=15 --ssh-flag=-oServerAliveCountMax=4)
          remote=/tmp/site-release-$sha
          t=$SECONDS
          python3 deploy/package-static-release.py --live live.sha256 --live-files live-files.txt --out "site-$sha.tar.gz" "${paths[@]}"
          bash deploy/upload-static-release.sh upload "$remote" "site-$sha.tar.gz" deploy/publish-static-release.sh -- "${ssh[@]}"
          echo "Upload: $((SECONDS - t)) s"; t=$SECONDS
          bash deploy/upload-static-release.sh publish "$remote" "site-$sha.tar.gz" deploy/publish-static-release.sh "$sha" -- "${ssh[@]}"
          echo "Switch release: $((SECONDS - t)) s"
      - name: Check the site
        run: curl --fail --silent --show-error --output /dev/null --retry 3 https://zachbednarke.com/
